[pytest]
; ---------- 日志配置 ----------
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)s] %(message)s
log_date_format = %H:%M:%S

; ---------- 测试发现规则 ----------
python_files = test_*.py
python_classes = Test*
python_functions = test_*

; ---------- 标记注册 ----------
markers =
    smoke: 冒烟测试（核心主流程 — 每次提交必跑）
    regression: 回归测试（全量功能验证）
    P0: P0 — 核心功能，必须通过
    P1: P1 — 重要功能
    P2: P2 — 次要功能 / 边界条件
    slow: 慢速测试（执行时间较长，不加入 CI 快速门禁）
    auth: 需要鉴权
    contract: 契约测试（接口结构校验）
    lifecycle: 生命周期场景测试

; ---------- 路径 ----------
testpaths = tests
pythonpath = .

; ---------- 告警过滤 ----------
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::ResourceWarning

; ---------- 并行执行 ----------
; addopts = -n 0 --dist=loadscope