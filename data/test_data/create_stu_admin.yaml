- title: "在普通状态下注册"
  url: "/api/student/user/register"
  request:
    json:
      "userName": "stu001"
      "password": "123456"
      "userLevel": 1








- title: "在管理员状态下用于创建管理员或者是学生用户的账号"
  url: "/api/admin/user/edit"
  request:
    json:
      "id": null
      "userName": "admin02"
      "password": "123456"
      "realName": "张三"
      "age": 18
      "status": 1
      "sex": 1
      "birthDay": "2000-01-01"
      "phone": "13800000000"
      "role": 3
      "userLevel": 1
#role 1是学生  3是管理员   status 1启用 2 禁用  id 新增传 null（或不传）；编辑时传用户 id
